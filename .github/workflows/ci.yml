name: Application CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tests migrations
      - name: Lint
        run: ruff check app tests migrations
      - name: Test
        env:
          APP_ENV: test
          SESSION_SECRET: ci-only-synthetic-session-secret-00000000
          SEED_DEMO_DATA: "false"
        run: pytest --cov=app --cov-report=term-missing
